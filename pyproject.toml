[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beatoven"
version = "0.1.0"
description = "BeatOven overlay: deterministic Oracle-to-music renderer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
addopts = "-q"
