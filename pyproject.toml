[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beatoven"
dynamic = ["version"]
description = "BeatOven: deterministic Oracle-to-music compiler."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Zero State" }]
keywords = ["generative-music", "eurorack", "midi", "control-voltage", "deterministic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.21.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "feedparser>=6.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
]
dev = [
    "black>=23.0.0",
    "httpx>=0.24.0",
    "jsonschema>=4.0.0",
    "mypy>=1.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest>=7.0.0",
]
audio = [
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
]
"hardware-midi" = [
    "python-rtmidi>=1.5.8",
    "cbor2>=5.4.0",
]
hardware = [
    "pyserial>=3.5",
    "cbor2>=5.4.0",
]
media = [
    "opencv-python>=4.8.0",
]
"media-full" = [
    "opencv-python>=4.8.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "pillow>=10.0.0",
    "librosa>=0.10.0",
]
all = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "pyserial>=3.5",
    "cbor2>=5.4.0",
    "opencv-python>=4.8.0",
    "transformers>=4.30.0",
    "timm>=0.9.0",
    "pillow>=10.0.0",
    "librosa>=0.10.0",
]

[project.urls]
Repository = "https://github.com/Zero-State-LLC/BeatOven"
Changelog = "https://github.com/Zero-State-LLC/BeatOven/blob/main/CHANGELOG.md"

[project.scripts]
beatoven = "beatoven.api.main:main"

[tool.setuptools.dynamic]
version = { attr = "beatoven.__version__" }

[tool.setuptools.packages.find]
include = ["beatoven*", "beatoven_overlay*", "aal_core*"]

[tool.setuptools.package-data]
beatoven = ["schemas/*.json", "output_module/vectors/*", "configs/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
