name: Output Module tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,hardware]"
      - name: Acceptance tests
        run: python -m pytest -q beatoven/output_module
      - name: Spec traceability
        run: python scripts/check_spec_trace.py
      - name: SEED replay on the simulated device
        run: python -m beatoven.output_module replay-check beatoven/output_module/vectors/stream.json
